[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railenv-editor"
version = "0.1.0"
description = "Visual editor for building Flatland railway rail environments (RailEnv)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MathgeniusTB2" }]
dependencies = [
    "PySide6>=6.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
flatland = ["flatland-rl>=2.1"]
dev = ["pytest>=7", "ruff>=0.4", "pyinstaller>=6.0"]

[project.scripts]
railenv-editor = "railenv_editor.app.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["railenv_editor*"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
