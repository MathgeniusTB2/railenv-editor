[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railenv-editor"
version = "0.1.0"
description = "A dependency-free web editor for Flatland railway environments (RailEnv)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MathgeniusTB2" }]
dependencies = []

[project.optional-dependencies]
flatland = ["flatland-rl>=2.1"]
dev = ["pytest>=7", "ruff>=0.4", "playwright>=1.40", "pillow>=10", "numpy>=1.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["railtiles"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
