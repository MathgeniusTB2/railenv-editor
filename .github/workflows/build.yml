name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos-x86_64
          - os: windows-latest
            artifact: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint and test
        run: |
          ruff check .
          pytest tests/ -q

      - name: Build binary (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm packaging/railenv_editor.spec

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm packaging/railenv_editor.spec
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: railenv-editor-${{ matrix.artifact }}
          path: dist/railenv-editor/
